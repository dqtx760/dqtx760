<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="大强同学 — AI效率顾问">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0f0a1e"/>
      <stop offset="100%" stop-color="#0c0505"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#f97316;#a855f7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1280" height="560" rx="26"/>
    </clipPath>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#f97316" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="1280" height="560" fill="url(#bgGrad)"/>
    <rect width="1280" height="560" fill="url(#grid)"/>

    <!-- ambient orbs -->
    <circle cx="120" cy="100" r="130" fill="url(#orbOrange)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 22,-18; 0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="460" r="160" fill="url(#orbPurple)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -28,16; 0,0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="80" r="90" fill="url(#orbOrange)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -16,20; 0,0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#fde68a">
      <circle cx="80" cy="420" r="2.2" opacity="0.7"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-55" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="500" r="1.7" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-65" dur="6.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="520" r="2" opacity="0.6" fill="#c084fc"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-60" dur="5.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="5.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="430" r="2.3" opacity="0.6" fill="#c084fc"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-50" dur="6.2s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.2s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="540" r="1.6" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-45" dur="7s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- border -->
    <rect x="4" y="4" width="1272" height="552" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.6" opacity="0.7"/>

    <!-- terminal top-left -->
    <g transform="translate(56,46)" font-family="Consolas, Courier New, monospace" font-size="14">
      <rect x="-14" y="-24" width="310" height="32" rx="8" fill="#0f172a" opacity="0.75" stroke="#1e293b" stroke-width="1"/>
      <circle cx="-2" cy="-8" r="4" fill="#ff5f57"/>
      <circle cx="13" cy="-8" r="4" fill="#febc2e"/>
      <circle cx="28" cy="-8" r="4" fill="#28c840"/>
      <text x="48" y="-3" fill="#fb923c">dqtx760@ai-agent</text>
      <text x="0" y="16" fill="#fde68a">
        <tspan fill="#a855f7">$</tspan> <tspan fill="#e2e8f0">whoami --ai-consultant</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
      </text>
      <rect x="193" y="4" width="9" height="15" fill="#f97316">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- main name -->
    <g transform="translate(56,136)">
      <text font-family="Segoe UI, Verdana, sans-serif" font-size="72" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">
        <tspan x="0" dy="0" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>大</tspan><tspan opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.32s" fill="freeze"/>强</tspan><tspan opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.44s" fill="freeze"/>同</tspan><tspan opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.56s" fill="freeze"/>学</tspan>
      </text>

      <!-- cycling subtitles -->
      <g font-family="Consolas, Courier New, monospace" font-size="20" fill="#93c5fd">
        <text x="4" y="46" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.08;0.23;0.26" dur="14s" begin="2.8s" repeatCount="indefinite"/>
          &gt; AI 效率顾问 · 让普通人用好 AI 工具
        </text>
        <text x="4" y="46" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.29;0.48;0.51" dur="14s" begin="2.8s" repeatCount="indefinite"/>
          &gt; Claude / Codex · AI Agent 自动化工作流
        </text>
        <text x="4" y="46" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.54;0.73;0.76" dur="14s" begin="2.8s" repeatCount="indefinite"/>
          &gt; Obsidian 知识管理 · 个人网站搭建
        </text>
        <text x="4" y="46" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.77;0.79;0.98;1" dur="14s" begin="2.8s" repeatCount="indefinite"/>
          &gt; 内容创作 · 工具安装排错 · 远程协助
        </text>
        <rect x="380" y="28" width="9" height="18" fill="#f97316">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- tagline box -->
    <g transform="translate(56,222)">
      <rect x="0" y="0" width="580" height="38" rx="10" fill="#0f172a" opacity="0" stroke="#f97316" stroke-opacity="0.3" stroke-width="1">
        <animate attributeName="opacity" values="0;0.75" dur="0.7s" begin="2.6s" fill="freeze"/>
      </rect>
      <text x="18" y="24" font-family="Consolas, monospace" font-size="14" fill="#d8b4fe" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.8s" fill="freeze"/>
        "把 AI 工具装好、用起来，接入你的日常工作流"
      </text>
    </g>

    <!-- tech pills row 1 -->
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">
      <g transform="translate(56,278)">
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
          <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-opacity="0.55"/>
          <text x="40" y="18" text-anchor="middle" fill="#fb923c">AI Agent</text>
        </g>
        <g transform="translate(88,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
          <rect width="72" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.55"/>
          <text x="36" y="18" text-anchor="middle" fill="#d8b4fe">自动化</text>
        </g>
        <g transform="translate(168,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze"/>
          <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-opacity="0.55"/>
          <text x="40" y="18" text-anchor="middle" fill="#fb923c">Obsidian</text>
        </g>
        <g transform="translate(256,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.3s" fill="freeze"/>
          <rect width="64" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.55"/>
          <text x="32" y="18" text-anchor="middle" fill="#d8b4fe">Codex</text>
        </g>
        <g transform="translate(328,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.4s" fill="freeze"/>
          <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-opacity="0.55"/>
          <text x="40" y="18" text-anchor="middle" fill="#fb923c">个人网站</text>
        </g>
        <g transform="translate(416,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.5s" fill="freeze"/>
          <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.55"/>
          <text x="40" y="18" text-anchor="middle" fill="#d8b4fe">内容创作</text>
        </g>
      </g>
      <!-- row 2 -->
      <g transform="translate(56,314)">
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
          <rect width="88" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-opacity="0.55"/>
          <text x="44" y="18" text-anchor="middle" fill="#fb923c">工具安装</text>
        </g>
        <g transform="translate(96,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.7s" fill="freeze"/>
          <rect width="96" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.55"/>
          <text x="48" y="18" text-anchor="middle" fill="#d8b4fe">Claude Code</text>
        </g>
        <g transform="translate(200,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
          <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-opacity="0.55"/>
          <text x="40" y="18" text-anchor="middle" fill="#fb923c">远程协助</text>
        </g>
        <g transform="translate(288,0)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.9s" fill="freeze"/>
          <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.55"/>
          <text x="40" y="18" text-anchor="middle" fill="#d8b4fe">知识工作流</text>
        </g>
      </g>
    </g>

    <!-- stats bar -->
    <g transform="translate(56,372)" font-family="Segoe UI, sans-serif" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="4.2s" fill="freeze"/>
      <g>
        <text x="0" y="0" font-size="28" font-weight="800" fill="#f97316">从 0 到用</text>
        <text x="0" y="20" font-size="12" fill="#94a3b8">AI 工具落地</text>
      </g>
      <g transform="translate(150,0)">
        <text x="0" y="0" font-size="28" font-weight="800" fill="#a855f7">全流程</text>
        <text x="0" y="20" font-size="12" fill="#94a3b8">安装到工作流</text>
      </g>
      <g transform="translate(290,0)">
        <text x="0" y="0" font-size="28" font-weight="800" fill="#fde68a">中文</text>
        <text x="0" y="20" font-size="12" fill="#94a3b8">本土化实践</text>
      </g>
      <g transform="translate(400,0)">
        <text x="0" y="0" font-size="28" font-weight="800" fill="#f97316">实战</text>
        <text x="0" y="20" font-size="12" fill="#94a3b8">非泛泛而谈</text>
      </g>
    </g>

    <!-- right panel: code card -->
    <g transform="translate(810,90)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze"/>
      <rect width="410" height="350" rx="16" fill="#070c1c" stroke="url(#borderGrad)" stroke-width="1.4" opacity="0.95"/>
      <rect width="410" height="34" rx="16" fill="#0c1630"/>
      <rect y="20" width="410" height="14" fill="#0c1630"/>
      <circle cx="18" cy="17" r="4.5" fill="#ff5f57"/>
      <circle cx="34" cy="17" r="4.5" fill="#febc2e"/>
      <circle cx="50" cy="17" r="4.5" fill="#28c840"/>
      <text x="205" y="21" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">ai_workflow.py</text>

      <g font-family="Consolas, Courier New, monospace" font-size="13">
        <text x="18" y="62" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/><tspan fill="#c084fc">def</tspan> <tspan fill="#fb923c">ai_for_everyone</tspan><tspan fill="#e2e8f0">():</tspan></text>
        <text x="36" y="88" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/><tspan fill="#e2e8f0">tools = [</tspan><tspan fill="#86efac">"Claude"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Codex"</tspan><tspan fill="#e2e8f0">]</tspan></text>
        <text x="36" y="112" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/><tspan fill="#e2e8f0">workflows = </tspan><tspan fill="#86efac">"obsidian+ai"</tspan></text>
        <text x="36" y="140" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/><tspan fill="#c084fc">for</tspan> <tspan fill="#e2e8f0">user in 普通人:</tspan></text>
        <text x="54" y="164" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.7s" fill="freeze"/><tspan fill="#e2e8f0">install(tools)</tspan></text>
        <text x="54" y="188" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.0s" fill="freeze"/><tspan fill="#e2e8f0">config(workflows)</tspan></text>
        <text x="54" y="212" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.3s" fill="freeze"/><tspan fill="#e2e8f0">user.能力 </tspan><tspan fill="#fb923c">+=</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#86efac">100</tspan></text>
        <text x="36" y="240" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.6s" fill="freeze"/><tspan fill="#c084fc">return</tspan> <tspan fill="#86efac">"AI 真正用起来了 🚀"</tspan></text>
        <rect x="340" y="228" width="8" height="14" fill="#f97316" opacity="0">
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.5;0.5;1" dur="1s" begin="3.6s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="272" opacity="0" fill="#334155" font-size="11"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="4s" fill="freeze"/># 微信技术支持: fix.dqtx.cc</text>
        <text x="18" y="292" opacity="0" fill="#334155" font-size="11"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.2s" fill="freeze"/># 教程: xodnytdcaw.feishu.cn</text>
        <text x="18" y="312" opacity="0" fill="#334155" font-size="11"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.4s" fill="freeze"/># YouTube: @dqtx760</text>
        <text x="18" y="332" opacity="0" fill="#334155" font-size="11"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.6s" fill="freeze"/># CSDN: blog.csdn.net/2402_82616859</text>
      </g>
    </g>

    <!-- neon sign bottom right -->
    <g transform="translate(810,464)" font-family="Segoe UI, sans-serif" font-size="17" font-weight="800" text-anchor="middle">
      <text x="205" y="0" fill="#f97316" filter="url(#glow)" opacity="0.95">
        <animate attributeName="opacity" values="0.95;0.3;0.95;0.95;0.15;0.95" keyTimes="0;0.08;0.12;0.7;0.74;1" dur="4.5s" begin="5s" repeatCount="indefinite"/>
        装好工具 · 用好 AI · 改变工作方式
      </text>
    </g>

    <!-- footer -->
    <g transform="translate(56,510)" font-family="Consolas, monospace" font-size="12" fill="#475569">
      <text x="0" y="0">中国 · fix.dqtx.cc · @dqtx760</text>
    </g>
    <g transform="translate(1224,510)" font-family="Consolas, monospace" font-size="12" fill="#334155" text-anchor="end">
      <text x="0" y="0">AI · 效率 · 实践 · 落地</text>
    </g>

    <!-- scan sweep -->
    <g clip-path="url(#bannerClip)">
      <rect width="1280" height="100" fill="url(#scanGrad)">
        <animate attributeName="y" values="-100;660" dur="3.5s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- reveal wipe -->
    <rect width="1280" height="560" fill="#030712">
      <animate attributeName="height" from="560" to="0" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="0" to="560" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect width="1280" height="5" fill="#f97316" opacity="0.95" filter="url(#glow)">
      <animate attributeName="y" from="0" to="560" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="opacity" values="0.95;0.95;0" dur="1.2s" begin="0s" fill="freeze"/>
    </rect>
  </g>
</svg>

